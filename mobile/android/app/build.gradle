plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.myfiles"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.example.myfiles"
        minSdk 24 // ML Kit document scanner requirement
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake { arguments "-DMYFILES_TESTS=OFF", "-DANDROID_STL=c++_static" }
        }
    }
    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.31.6"
        }
    }
    sourceSets {
        main {
            // SDL's Java glue (org.libsdl.app), fetched by ../fetch-sdl-java.sh
            java.srcDirs += ["src/main/sdl-java"]
            assets.srcDirs = ["../../assets"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
